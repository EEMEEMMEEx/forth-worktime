name: CI

on:
  push:
    branches:
      - main
      - master
      - 'chore/**'
      - 'feat/**'
  pull_request:

jobs:
  test:
    name: Go Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v -count=1 ./...

      - name: Go Build
        run: go build -v ./cmd/worktime
